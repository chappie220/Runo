name: Release

# Push a tag such as v0.2.0 (matching Cargo.toml's release) to publish the
# binaries and SHA256SUMS that `runo update` installs; a0.2.0 or
# b0.2.0 publishes an alpha or beta as a pre-release.
on:
  push:
    tags: ["v*", "a[0-9]*", "b[0-9]*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          # package.metadata.runo.release when set (it may have a fourth
          # part), else the package version.
          version=$(sed -n 's/^release = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          # Releases are tagged v<release>; alpha and beta builds
          # (a0.3.7, b0.3.7) by their release number as it is.
          case "$version" in
            a[0-9]*|b[0-9]*) tag="$version" ;;
            *) tag="v$version" ;;
          esac
          if [ "$tag" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml release $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pip install ziglang cargo-zigbuild
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/runo runo-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: runo-${{ matrix.target }}
          path: runo-${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # Binaries from before the rename (openclaw-rs 0.4 and older) update
      # by looking for openclaw-rs-<target>: the same files under that name.
      - run: |
          cd dist
          for f in runo-*; do cp "$f" "openclaw-rs-${f#runo-}"; done
          sha256sum runo-* openclaw-rs-* > SHA256SUMS && cat SHA256SUMS
      # A release made by hand for this tag (e.g. on the website) gets the
      # files; otherwise one is created. Re-runs replace the files.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Alpha (a0.3.7) and beta (b0.3.7) builds are pre-releases:
            # `update` follows the latest release, which skips them.
            prerelease=
            case "$GITHUB_REF_NAME" in
              a[0-9]*|b[0-9]*|*-rc*) prerelease=--prerelease ;;
            esac
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
