name: Release

# Push a tag such as v0.2.0 (matching Cargo.toml's version) to publish the
# binaries and SHA256SUMS that `openclaw-rs update` installs.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      matrix:
        target: [aarch64-unknown-linux-musl, x86_64-unknown-linux-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches Cargo.toml
        run: |
          # package.metadata.openclaw.release when set (it may have a fourth
          # part), else the package version.
          version=$(sed -n 's/^release = "\(.*\)"/\1/p' Cargo.toml | head -1)
          [ -n "$version" ] || version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match Cargo.toml release $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - run: pip install ziglang cargo-zigbuild
      - run: cargo zigbuild --locked --release --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/openclaw-rs openclaw-rs-${{ matrix.target }}
      - uses: actions/upload-artifact@v4
        with:
          name: openclaw-rs-${{ matrix.target }}
          path: openclaw-rs-${{ matrix.target }}

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - run: cd dist && sha256sum openclaw-rs-* > SHA256SUMS && cat SHA256SUMS
      # A release made by hand for this tag (e.g. on the website) gets the
      # files; otherwise one is created. Re-runs replace the files.
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --clobber
          else
            # Alpha (-a1) and beta (-b1) tags are pre-releases: `update`
            # follows the latest release, which skips them.
            prerelease=
            case "$GITHUB_REF_NAME" in
              *-a[0-9]*|*-alpha*|*-b[0-9]*|*-beta*|*-rc*) prerelease=--prerelease ;;
            esac
            gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --generate-notes $prerelease
          fi
