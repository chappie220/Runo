name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: shellcheck -s sh scripts/*.sh
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace

  aarch64-musl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: pip install ziglang cargo-zigbuild
      - run: cargo zigbuild --locked --release --target aarch64-unknown-linux-musl
      - uses: actions/upload-artifact@v4
        with:
          name: runo-aarch64-unknown-linux-musl
          path: target/aarch64-unknown-linux-musl/release/runo

  # The SD card writer for PCs: built for Linux and Windows, and tested on
  # Windows too.
  flash:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            exe: runo-flash
            file: runo-flash-x86_64-linux
          - target: x86_64-pc-windows-gnu
            exe: runo-flash.exe
            file: runo-flash-x86_64-windows.exe
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: flash-${{ matrix.target }}
      - run: pip install ziglang cargo-zigbuild
      - run: cargo zigbuild --locked --release -p runo-flash --target ${{ matrix.target }}
      - run: cp target/${{ matrix.target }}/release/${{ matrix.exe }} ${{ matrix.file }}
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.file }}
          path: ${{ matrix.file }}

  flash-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --locked -p runo-flash
