[package]
name = "runo"
version = "1.0.0"
edition = "2024"
description = "Runo: a single-binary AI companion Gateway: OpenRouter agent, SQLite state, Web/CLI/QQ"
license = "MIT"
publish = false

[package.metadata.runo]
# The release number: what `--version` shows, `update` compares and the
# tag is (v<release>). It may add a fourth part to `version`, which Cargo
# keeps at three, a leading `a` (alpha) or `b` (beta), and a revision
# (`-1`, newer than without); without it the release is `version`.
release = "1.0.0-2"

[workspace]
members = [".", "link", "flash"]

[[bin]]
name = "runo"
path = "src/main.rs"

[dependencies]
# The console's font: a glyph is read when first drawn (fontdue parses all
# 45,000 of WenQuanYi Zen Hei at start, over 200 MB).
ab_glyph = { version = "0.2.32", default-features = false, features = ["std"] }
anyhow = "1.0.104"
async-imap = { version = "0.12.0", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1.92"
# Already linked by rustls; used for release checksums.
aws-lc-rs = { version = "1.18.1", default-features = false, features = ["aws-lc-sys"] }
axum = { version = "0.8.9", features = ["ws"] }
base64 = "0.22"
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
clap_complete = "4.6.11"
croner = "4.0.1"
crossterm = { version = "0.29", features = ["event-stream"] }
encoding_rs = "0.8.42"
flate2 = "1.1.10"
futures-util = "0.3.34"
lettre = { version = "0.11.23", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls", "rustls-native-certs", "hostname", "aws-lc-rs"] }
libc = "0.2.190"
runo-link = { path = "link" }
mail-parser = { version = "0.11.9", features = ["full_encoding"] }
pulldown-cmark = { version = "0.13.4", default-features = false }
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls", "http2"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
rustls-native-certs = "0.8.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tar = { version = "0.4.46", default-features = false }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "io-std", "io-util", "signal", "time", "sync", "process", "fs", "net"] }
tokio-rustls = "0.26.6"
tokio-tungstenite = { version = "0.30.0", features = ["rustls-tls-native-roots", "connect"] }
toml = "1.1.8"
toml_edit = { version = "0.25.17", default-features = false, features = ["parse", "display"] }
# The faces in a font collection (ab_glyph reads it too).
ttf-parser = { version = "0.25.1", default-features = false, features = ["std"] }
unicode-width = "0.2.2"
vte = "0.15.0"

[profile.release]
# Small binary and low RSS on Raspberry Pi class hosts.
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dev-dependencies]
png = "0.18.1"
tempfile = "3.27.0"
