#!/usr/sbin/nft -f
# Runo's firewall (design 4.9): nothing comes in but runod's port, the
# ICMP and ICMPv6 that IPv4 and IPv6 need, DHCP answers and mDNS.
# Rules of your own go in /data/etc/nftables.d/*.nft, for example:
#   add rule inet runo input tcp dport 8080 ip6 saddr fd00::/8 accept
flush ruleset

table inet runo {
	chain input {
		type filter hook input priority filter; policy drop;
		ct state established,related accept
		ct state invalid drop
		iif lo accept

		# Neighbour discovery, router advertisements and path MTU.
		icmpv6 type { destination-unreachable, packet-too-big, time-exceeded,
			parameter-problem, echo-request, nd-router-advert,
			nd-neighbor-solicit, nd-neighbor-advert, mld-listener-query } accept
		icmp type { destination-unreachable, time-exceeded,
			parameter-problem, echo-request } accept

		# DHCP and DHCPv6 answers.
		udp sport 67 udp dport 68 accept
		ip6 saddr fe80::/10 udp sport 547 udp dport 546 accept

		# mDNS: the device answers on the local network.
		ip daddr 224.0.0.251 udp dport 5353 accept
		ip6 daddr ff02::fb udp dport 5353 accept

		# runod: TLS with pinned keys; pairing only from the LAN, and
		# trusted clients from elsewhere log in with the device password.
		tcp dport 7340 accept
	}

	chain forward {
		type filter hook forward priority filter; policy drop;
	}
}

include "/data/etc/nftables.d/*.nft"
