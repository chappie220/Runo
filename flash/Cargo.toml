[package]
name = "runo-flash"
version = "0.5.0"
edition = "2024"
description = "Writes the Runo system image to an SD card, from a PC"
license = "MIT"
publish = false

[[bin]]
name = "runo-flash"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
crossterm = "0.29"
fatfs = { version = "0.3.6", default-features = false, features = ["std", "alloc"] }
getrandom = "0.3.4"
lzma-rs = "0.3.0"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls", "http2", "system-proxy"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.1"
unicode-width = "0.2.2"
zip = { version = "9.0.4", default-features = false, features = ["deflate-flate2-zlib-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2.190"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3.27.0"
